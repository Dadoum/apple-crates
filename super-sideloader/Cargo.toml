[package]
name = "super-sideloader"
version = "0.1.0"
edition = "2021"

[dependencies]
adi.workspace = true
android-coreadi.workspace = true
apple-codesign = { path = "../apple-codesign-quick" }
async_zip = { version = "0.0.18", features = ["deflate", "tokio", "tokio-fs"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
crc32fast = "1.5"
directories = "6.0.0"
env_logger = "0.11.8"
flate2 = "1.1"
futures-lite = "2.6.1"
grandslam.workspace = true
gpui = { package = "gpui", git = "https://github.com/gpui-ce/gpui-ce" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "277f220a6196572116a8fd84fba6c36187094cab" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
idevice = { version = "0.1.64", features = ["afc", "installation_proxy", "usbmuxd"] }
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
log = "0.4.33"
plist.workspace = true
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
rand = "0.10.2"
reqwest.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
sha1.workspace = true
# Match the RustCrypto versions used by apple-codesign.
der = { version = "0.7.10", features = ["alloc", "std"] }
rsa = { version = "0.9.9", features = ["sha2", "getrandom"] }
sha2_010 = { package = "sha2", version = "0.10" }
x509-cert = { version = "0.2.5", features = ["builder"] }
thiserror.workspace = true
tempfile = "3.27"
toml = "0.8.23"
tokio = { workspace = true, features = ["fs", "io-util", "net", "time"] }
uuid = { version = "1.19", features = ["v4"] }
walkdir = "2.5"
xcode.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
adid-proxy = { path = "../adid-proxy" }
core-foundation = "0.10.0"
libc = "0.2.176"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
dlopen2 = "0.8.2"
library-coreadi.workspace = true
ouroboros = "0.18.5"
