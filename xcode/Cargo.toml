[package]
name = "xcode"
version = "0.1.0"
edition = "2024"

[dependencies]
adi.workspace = true
grandslam.workspace = true
plist.workspace = true
plist-macros.workspace = true

reqwest.workspace = true
thiserror.workspace = true

serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
sys-locale = "0.3.2"
uuid = { version = "1.19", features = ["v4"] }

[dev-dependencies]
android-coreadi.workspace = true

tokio = { version = "1.0", features = ["full"] }
env_logger = "0.11.11"
